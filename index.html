<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Someone Special ❤️</title>
    <style>
        /* CSS Reset and Core Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle, #1a001a 0%, #000000 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Container for content */
        .love-container {
            text-align: center;
            z-index: 10;
        }

        /* Heartbeat Animation Styles */
        .heart {
            font-size: 5rem;
            color: #ff3366;
            animation: heartbeat 1.2s infinite ease-in-out;
            text-shadow: 0 0 20px #ff3366, 0 0 40px #ff0040;
            margin-bottom: 20px;
        }

        /* Glow Text Style */
        .love-text {
            font-size: 4rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #fff;
            text-shadow: 0 0 10px #ff3366, 
                         0 0 20px #ff3366, 
                         0 0 40px #ff3366, 
                         0 0 80px #ff3366;
            animation: textPulse 2.4s infinite alternate;
        }

        /* Subtext Style */
        .sub-text {
            color: #ffb3d1;
            margin-top: 15px;
            font-size: 1.2rem;
            font-style: italic;
            letter-spacing: 2px;
            opacity: 0.8;
        }

        /* Keyframes for Heartbeat */
        @keyframes heartbeat {
            0% { transform: scale(1); }
            20% { transform: scale(1.25); }
            40% { transform: scale(1.1); }
            60% { transform: scale(1.3); }
            80% { transform: scale(1); }
            100% { transform: scale(1); }
        }

        /* Keyframes for Text Pulse */
        @keyframes textPulse {
            0% { transform: scale(0.98); opacity: 0.9; }
            100% { transform: scale(1.02); opacity: 1; }
        }

        /* Background floating hearts logic using CSS */
        .floating-heart {
            position: absolute;
            color: rgba(255, 51, 102, 0.4);
            pointer-events: none;
            bottom: -50px;
            animation: floatUp 6s linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-105vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Floating Background Hearts -->
    <div class="floating-heart" style="left: 10%; font-size: 20px; animation-delay: 0s; animation-duration: 7s;">❤️</div>
    <div class="floating-heart" style="left: 25%; font-size: 35px; animation-delay: 2s; animation-duration: 5s;">💖</div>
    <div class="floating-heart" style="left: 40%; font-size: 15px; animation-delay: 4s; animation-duration: 8s;">❤️</div>
    <div class="floating-heart" style="left: 60%; font-size: 40px; animation-delay: 1s; animation-duration: 6s;">💘</div>
    <div class="floating-heart" style="left: 75%; font-size: 25px; animation-delay: 3s; animation-duration: 7s;">❤️</div>
    <div class="floating-heart" style="left: 90%; font-size: 30px; animation-delay: 5s; animation-duration: 4s;">💝</div>

    <!-- Main Message Container -->
    <div class="love-container">
        <div class="heart">❤️</div>
        <h1 class="love-text">I Love You</h1>
        <p class="sub-text">Today, tomorrow, and forever...</p>
    </div>

</body>
</html>
